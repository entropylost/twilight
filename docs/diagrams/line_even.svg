<text xml:space="preserve" x="16.0" y="216.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">The two halves follow each other along the same line:</text>
<text xml:space="preserve" x="16.0" y="234.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">A = line(start, lo) (blue),   B = line(start+lo, lo) (orange)</text>
<text xml:space="preserve" x="16.0" y="252.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">result = A over B:   T = T(A) · T(B),   L = L(A) + T(A) · L(B)</text>
