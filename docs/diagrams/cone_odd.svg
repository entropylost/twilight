<text xml:space="preserve" x="16.0" y="164.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">Cone extension of size 2s, odd index: delta = lo + hi (dashed). Its straight edge is the upper one; at the middle column it covers</text>
<text xml:space="preserve" x="16.0" y="182.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">the pixel on that edge fully ("full") and half of the other ("half"). eb / et are its end pixels end_bottom / end_top.</text>
<text xml:space="preserve" x="16.0" y="200.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  1. edge line = line(start, 2·edge): the whole line along the straight edge</text>
<text xml:space="preserve" x="16.0" y="218.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  2. first cone = cone(start, lo): first half, ends in full and half</text>
<text xml:space="preserve" x="16.0" y="236.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  3. second cone = cone(start+full, lo): continues the first cone from the full pixel</text>
<text xml:space="preserve" x="16.0" y="254.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  4. narrow line = line(start+half, edge): continues the first cone from the half pixel</text>
<text xml:space="preserve" x="16.0" y="272.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">Each piece is attenuated only by the piece it continues (T1→full, T1→half: the first cone's two end transmittances):</text>
<text xml:space="preserve" x="16.0" y="290.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  L = ½ · [ L(edge line) + L(first cone) + T1→full · L(second cone) + T1→half · L(narrow line) ]</text>
<text xml:space="preserve" x="16.0" y="308.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  T towards et = ½ · [ T(edge line) + T1→full · T(second cone → et) ]</text>
<text xml:space="preserve" x="16.0" y="326.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  T towards eb = ½ · [ T1→full · T(second cone → eb) + T1→half · T(narrow line) ]</text>
<text xml:space="preserve" x="16.0" y="344.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">Stored as transmittance = mean of the two and spread = half their difference.</text>
</svg>
