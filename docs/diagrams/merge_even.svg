<text xml:space="preserve" x="111.2" y="221.3" font-size="11.5" text-anchor="end" fill="#2f6fbe" stroke="#ffffff" stroke-width="3" paint-order="stroke">near</text>
<text xml:space="preserve" x="16.0" y="396.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">near = cone extension from start = F + (s, i) to end_bottom = start + (s, i): the cone's second s columns.</text>
<text xml:space="preserve" x="16.0" y="414.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">The two far cones have the same focus and size 2s; they take over at the near extension's two end pixels (eb, et):</text>
<text xml:space="preserve" x="16.0" y="432.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  L = L(near) + T(near → eb) · L(far 2i) + T(near → et) · L(far 2i+1)</text>
<text xml:space="preserve" x="16.0" y="450.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">Grey: the cone's first s columns, which it never reads: its extensions start s columns ahead of the focus</text>
<text xml:space="preserve" x="16.0" y="468.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">(for the size-1 cones of a probe, that is the probe's own pixel, read by probe_pixel).</text>
