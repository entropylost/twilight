<text xml:space="preserve" x="440.0" y="240.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">The near part spans 2s columns from start = F + (s, i) and is the sum of three</text>
<text xml:space="preserve" x="440.0" y="258.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">extensions of size 2s, each resampled into the cone:</text>
<text xml:space="preserve" x="440.0" y="276.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  bottom = cone(start, 2·(s, i))                 along the lower edge</text>
<text xml:space="preserve" x="440.0" y="294.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  top = cone(start, (2s, 2i+1))                   along the upper edge</text>
<text xml:space="preserve" x="440.0" y="312.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  middle = line(start, (2s, 2i+1))               where the two overlap</text>
<text xml:space="preserve" x="440.0" y="330.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  L(near) = L(bottom) + L(top) − 2 · L(middle)</text>
<text xml:space="preserve" x="440.0" y="348.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">The far cones of size 2s are focused one step ahead of F, at start and above it.</text>
<text xml:space="preserve" x="440.0" y="366.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">They take over at bottom's lower end pixel (eb) and top's upper end pixel (et):</text>
<text xml:space="preserve" x="440.0" y="384.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke">  long = L(near) + T(bottom → eb) · L(far 2i) + T(top → et) · L(far 2i+1)</text>
<text xml:space="preserve" x="440.0" y="402.0" font-size="12.5" text-anchor="start" fill="#1b1b1b" stroke="#ffffff" stroke-width="3" paint-order="stroke"></text>
