<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<link data-trunk rel="scss" href="style.scss">
		<title>Twilight</title>
	</head>
	<body>
		<canvas id="main"></canvas>
		<div id="controls">
			<label for="transmission">Reprojection mode:</label>
			<select name="transmission" id="transmission"></select>
			<br>
			<label for="frustum-len">Frustum length:</label>
			<input type="number" name="frustum-len" id="frustum-len" value="2" step="0.1" min="1" max="4">
			<br>
			<input type="checkbox" name="skip-linear" id="skip-linear" checked>
			<label for="skip-linear">Skip strips / B-type rays</label>
			<br>
			<input type="checkbox" name="pretrace" id="pretrace" checked>
			<label for="pretrace">Pretrace transmittance</label>
			<br>
			<label for="merge-mode">Merge mode:</label>
			<select name="merge-mode" id="merge-mode"></select>
		</div>
		<link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="z" data-bin="twilight">
	</body>
</html>
